<style>
:root{--ink:#18212b;--muted:#687481;--navy:#17324d;--blue:#2563eb;--green:#16794a;--red:#b42318;--amber:#9a5b00;--purple:#6d3fc0;--bg:#f4f6f8;--line:#d9e0e7;--shadow:0 8px 24px #17324d14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}body.busy{cursor:progress}body.busy button{pointer-events:none;opacity:.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:15px max(16px,calc((100% - 1120px)/2));background:var(--navy);color:#fff}.topbar h1,.topbar p{margin:0}.topbar h1{font-size:22px}.topbar small{color:#abc0d2;font-size:11px}.topbar p{color:#cad6e2;font-size:13px}.top-actions{display:flex;align-items:center;gap:10px}.top-actions span{font-size:12px;color:#cad6e2}.icon{border:1px solid #7890a7;border-radius:50%;background:transparent;color:#fff;width:40px;height:40px;font-size:22px}
.target-banner,.stages,.toolbar,.lane-strip,.queue,.bulk,.safe-bar,.ready-bar,.validation,.error-panel{max-width:1120px;margin-left:auto;margin-right:auto}.target-banner{margin-top:12px;padding:10px 16px;border:1px solid #9bc8aa;border-radius:11px;background:#e8f7ee;color:#12623d;display:flex;justify-content:space-between;gap:12px}.target-banner.live{border-color:#d49a35;background:#fff3dc;color:#7b4700}.target-banner.disabled{border-color:#efb0aa;background:#fff2f0;color:var(--red)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 7px}.stages button,.lane-strip button{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px}.stages button{display:flex;flex-direction:column;gap:2px;align-items:center}.stages button.active,.lane-strip button.active{border-color:var(--blue);background:#eaf1ff;color:#174da6}.stages strong{font-size:11px;font-weight:normal;color:var(--muted)}.lane-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:7px 16px}.lane-strip strong{margin-left:6px}
.toolbar{display:grid;grid-template-columns:1fr 1.15fr .75fr .65fr .75fr 1.25fr 1.5fr 1fr;gap:8px;padding:7px 16px}.toolbar input,.toolbar select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.bulk,.safe-bar,.ready-bar{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 16px;border-radius:12px;background:#eaf1ff;box-shadow:var(--shadow)}.safe-bar{background:#f0ebff}.ready-bar{background:#e8f7ee}.bulk button{margin-left:5px}
.queue{padding:8px 16px 24px}.paragraph-card{margin:14px 0;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);overflow:hidden}.paragraph-card>header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}.paragraph-card>header div:first-child{display:flex;gap:12px;align-items:baseline}.paragraph-card>header span{color:var(--muted);font-size:12px}.progress{display:flex;gap:4px}.progress i{width:10px;height:10px;border-radius:50%;background:#d6dce2}.paragraph-text{padding:18px 20px;font:18px/2 Arial,sans-serif;white-space:pre-wrap}.subdued{color:#8c969f}.focus-sentence{color:var(--ink)}.change-mark{padding:2px 3px;border-radius:4px;background:#fff0a8;color:#664d00;cursor:pointer;border:1px solid transparent}.change-mark:hover{border-color:var(--blue)}.change-mark.active{background:#ffe071;outline:3px solid #2563eb44}.change-mark.selected{outline:3px solid var(--blue)}.s-accepted{background:#dff6e8!important;color:#12623d!important}.s-modified{background:#e9e1ff!important;color:#5b31a5!important}.s-rejected{background:#fee4e2!important;color:var(--red)!important;text-decoration:line-through}.s-discuss{background:#fff0cf!important;color:#865000!important}.s-conflict{background:#fbc5c1!important;color:#7b1711!important}.s-applied{background:#dce8f5!important;color:#294d70!important}.progress .s-pending{background:#d6dce2!important}
.active-strip{border-top:1px solid var(--line);background:#fbfcfd}.strip-nav{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;color:var(--muted);font-size:12px}.strip-nav button{min-height:32px;padding:3px 11px}.change{padding:12px 18px;font:18px/1.8 Arial,sans-serif;overflow-wrap:anywhere}.change span{color:#596675}del,ins{margin:0 4px;padding:2px 4px;border-radius:4px}del{background:#fee4e2;color:var(--red)}ins{background:#dcfae6;color:var(--green);font-weight:bold;text-decoration:none}.active-strip>p{margin:0;padding:0 18px 12px;color:var(--muted);font-size:13px}.active-strip footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);min-height:62px}.active-strip footer>span{margin-right:auto}.select-one{margin-right:auto}.select-one.on{border-color:var(--blue);background:#eaf1ff;color:#174da6}
button.primary,button.secondary,button.danger,button.discuss,button.apply,.load-more{min-height:39px;padding:8px 12px;border-radius:9px;font-weight:bold}.primary{border:1px solid var(--green);background:var(--green);color:#fff}.danger{border:1px solid #efb0aa;background:#fff2f0;color:var(--red)}.discuss{border:1px solid #e9bf77;background:#fff7e8;color:var(--amber)}.apply{border:1px solid var(--navy);background:var(--navy);color:#fff}.secondary,.load-more{border:1px solid var(--line);background:#fff;color:var(--ink)}.load-more{display:block;margin:0 auto 60px}.empty,.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.validation{margin-top:10px;padding:12px 16px;border:1px solid #efb0aa;border-radius:10px;background:#fff2f0;color:var(--red)}.error-panel{margin-top:10px;padding:12px 16px;border:1px solid #efb0aa;border-radius:10px;background:#6f1d1b;color:#fff;display:flex;justify-content:space-between;gap:12px}.error-panel pre{margin:5px 0 0;white-space:pre-wrap;font:13px/1.45 Arial,sans-serif}.error-actions{display:flex;gap:6px;align-items:flex-start}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 16px;border-radius:10px;background:#18212b;color:#fff;box-shadow:var(--shadow)}
dialog{width:min(560px,calc(100% - 28px));border:0;border-radius:16px;padding:20px;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0d182477}dialog h2{margin-top:0}dialog label{display:block;margin:12px 0 5px;font-weight:bold}.original{padding:10px;border-radius:9px;background:#f4f6f8}.original small,.original strong{display:block}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.live-confirmation{display:flex;align-items:flex-start;gap:8px;padding:12px;border:1px solid #d49a35;border-radius:9px;background:#fff3dc;color:#7b4700}.live-confirmation input{width:18px;height:18px;flex:none}
@media(max-width:900px){.toolbar{grid-template-columns:repeat(4,1fr)}.toolbar #search{grid-column:span 2}.active-strip footer{flex-wrap:wrap}}@media(max-width:700px){.stages,.lane-strip{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.bulk,.safe-bar,.ready-bar{border-radius:0;gap:8px}.paragraph-text{font-size:17px;padding:15px}.active-strip footer{display:grid;grid-template-columns:1fr 1fr}.active-strip footer>span,.select-one{grid-column:1/-1;margin:0}.paragraph-card>header{align-items:flex-start}.paragraph-card>header div:first-child{display:block}.error-panel{border-radius:0}.subdued{color:#727d87}}
.stages{grid-template-columns:repeat(5,1fr)}
.stages button[data-stage="DISCUSSION"]{border-color:#e9bf77}.stages button[data-stage="DISCUSSION"].active{background:#fff0cf;color:#865000}
.discussion-resolution{display:inline-block;max-width:42rem;padding:.45rem .65rem;border-radius:.45rem;background:#fff0cf;color:#6b4300}
.progress{flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:42%}.progress i{width:12px;height:12px;cursor:pointer;flex:none}
.focus-sentence{font-weight:600}.change-mark.out-of-scope,.progress .out-of-scope{opacity:.22;filter:grayscale(1)}
.change{height:112px;overflow:auto}.active-strip>p{height:48px;overflow:auto;padding-bottom:10px}
.toast{display:flex;align-items:center;gap:14px}.toast button{border:1px solid #fff8;background:transparent;color:#fff;border-radius:7px;padding:4px 9px;font-weight:bold}
@media(max-width:700px){.stages{grid-template-columns:1fr 1fr}.progress{max-width:50%}.change{height:132px}.active-strip>p{height:58px}}
</style>


<style>
/* v13 interaction hardening */
.lane-bulk{max-width:1120px;margin:8px auto 0;padding:10px 16px;border-radius:12px;background:#eef3f8;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5}
.paragraph-card{display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.paragraph-card>header,.active-strip{flex:none}
.paragraph-text{flex:1 1 auto;min-height:140px;max-height:42vh;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth;scroll-padding-block:72px}
.s-accepted{background:#c8efd8!important;color:#0b4f31!important}
.pattern-action{border-color:#9bb6d1!important;background:#edf5fc!important;color:#17324d!important}
@media(max-width:700px){
  .lane-bulk{border-radius:0;align-items:flex-start}
  .paragraph-card{max-height:calc(100vh - 72px)}
  .paragraph-text{max-height:32vh;min-height:110px}
  .progress{min-width:110px;max-width:55%;overflow:visible}
}

/* v14 preparation workflow */
.prepare-button{min-height:38px;padding:7px 12px;border:1px solid #abc0d2;border-radius:9px;background:#fff;color:var(--navy);font-weight:bold}
.preparation-dialog{width:min(760px,calc(100% - 28px))}.prep-intro{color:var(--muted)}
.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prep-grid label{margin:0}.prep-grid input{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
.estimate-actions{display:flex;align-items:center;gap:10px;margin:10px 0}.estimate-actions span{font-size:12px;color:var(--muted)}
.prep-estimate{margin:10px 0;padding:12px 14px;border:1px solid #a9c4e0;border-radius:10px;background:#edf5fc}.prep-estimate p{margin:5px 0;color:var(--muted)}.prep-estimate small{display:block;margin-top:8px;color:var(--muted)}.prep-estimate table{width:100%;margin-top:8px;border-collapse:collapse;background:#fff}.prep-estimate th,.prep-estimate td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}.prep-estimate th:first-child,.prep-estimate td:first-child{text-align:left}.prep-estimate tr.recommended{background:#e8f7ee}.prep-estimate.blocked{border-color:#efb0aa;background:#fff2f0;color:var(--red)}
.review-plan{margin:10px 0;padding:9px 11px;border-radius:9px;background:#fff}.review-plan ol{margin:6px 0 0;padding-left:22px}.review-plan li{margin:4px 0;color:var(--muted)}
.prep-status{margin:14px 0 8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.prep-status p{margin:4px 0 0;color:var(--muted)}
.prep-status.running{border-color:#a9c4e0;background:#edf5fc}.prep-status.ready{border-color:#9bc8aa;background:#e8f7ee}.prep-status.blocked{border-color:#efb0aa;background:#fff2f0;color:var(--red)}
.prep-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}.prep-metrics div{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:center}.prep-metrics strong,.prep-metrics span{display:block}.prep-metrics span{font-size:11px;color:var(--muted)}
.excluded-concerns{margin-top:12px;padding:10px;border:1px solid #e9bf77;border-radius:9px;background:#fffaf0;color:var(--ink)}.excluded-concerns summary{cursor:pointer;font-weight:bold;color:var(--amber)}.excluded-concerns div{margin-top:9px;padding-top:9px;border-top:1px solid #ecd9b6;font-size:13px}.excluded-concerns del,.excluded-concerns ins{margin:0}.excluded-concerns small{color:var(--muted)}
@media(max-width:700px){.top-actions{gap:6px}.prepare-button{padding:6px 8px}.prep-grid{grid-template-columns:1fr}.prep-metrics{grid-template-columns:1fr 1fr}.preparation-dialog .dialog-actions{flex-wrap:wrap}}
</style>
