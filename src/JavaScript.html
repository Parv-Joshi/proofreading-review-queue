function local(ids,status,modified){S.rows.forEach(r=>{if(ids.includes(r.correction_id)){r.status=status;r.applied_status='';if(modified!==undefined)r.modified_text=modified}});ids.forEach(id=>S.selected.delete(id));render()}
function enqueue(name,arg,rollback,attempt=0){S.rpcQueue.push({name,arg,rollback,attempt});syncLabel();drain()}
function lockError(e){return/lock timeout|holding the lock|could not acquire/i.test(e&&e.message?e.message:String(e))}
function drain(){if(S.rpcBusy||!S.rpcQueue.length)return;S.rpcBusy=true;const job=S.rpcQueue.shift();google.script.run.withSuccessHandler(()=>{S.rpcBusy=false;syncLabel();drain()}).withFailureHandler(e=>{S.rpcBusy=false;if(lockError(e)&&job.attempt<3){S.rpcQueue.unshift({...job,attempt:job.attempt+1});syncLabel();setTimeout(drain,600*(job.attempt+1));return}if(job.rollback)job.rollback();syncLabel();fail(e);drain()})[job.name](job.arg)}
function syncLabel(){const n=S.rpcQueue.length+(S.rpcBusy?1:0);$('#syncStatus').textContent=n?`Saving ${n}…`:'Saved'}
function whenSynced(fn){if(!S.rpcBusy&&!S.rpcQueue.length)return fn();toast('Finishing background saves…');const t=setInterval(()=>{if(!S.rpcBusy&&!S.rpcQueue.length){clearInterval(t);fn()}},100)}
function expandDecisionIds(ids,status){const out=new Set(ids);if(status!=='ACCEPTED')return[...out];ids.forEach(id=>{const r=S.rows.find(x=>x.correction_id===id);if(!r?.decision_group||up(r.review_lane)==='REFERENCE')return;S.rows.forEach(x=>{if(x.decision_group===r.decision_group&&up(x.status)==='PENDING'&&up(x.review_lane)!=='REFERENCE')out.add(x.correction_id)})});return[...out]}
function decide(ids,status,notes,focusNext=false){ids=expandDecisionIds(ids,status);const old=ids.map(id=>{const r=S.rows.find(x=>x.correction_id===id);return[id,r.status,r.modified_text,r.applied_status]});if(focusNext)S.focusNextAfterRender=true;local(ids,status);undoToast(`${ids.length} ${label(status).toLowerCase()}`,ids);enqueue('bulkDecide',{correctionIds:ids,status,notes,sessionId:S.sessionId},()=>{old.forEach(x=>{const r=S.rows.find(y=>y.correction_id===x[0]);r.status=x[1];r.modified_text=x[2];r.applied_status=x[3]});render()})}
function bulk(status){const ids=[...S.selected];if(!ids.length)return;if(status==='DISCUSS')openDiscuss(ids);else decide(ids,status,'Paragraph highlight bulk decision',true)}
function acceptSafe(){const ids=visibleGroups().flatMap(x=>x.relevant).filter(r=>up(r.status)==='PENDING'&&['SAFE','TRUSTED'].includes(up(r.review_lane))).map(r=>r.correction_id);if(ids.length)decide(ids,'ACCEPTED','Accepted remaining safe changes',true)}
function acceptFamily(id){const row=S.rows.find(r=>r.correction_id===id),family=row?.rule_family_id;if(!family)return;const ids=S.rows.filter(r=>r.rule_family_id===family&&up(r.status)==='PENDING'&&up(r.review_lane)!=='REFERENCE').map(r=>r.correction_id);if(ids.length)decide(ids,'ACCEPTED',`Accepted trusted rule family ${family}`,true)}
function undo(ids){const old=ids.map(id=>{const r=S.rows.find(x=>x.correction_id===id);return[id,r.status,r.applied_status]});local(ids,'PENDING');toast('Decision undone');enqueue('undoDecision',{correctionIds:ids,sessionId:S.sessionId},()=>{old.forEach(x=>{const r=S.rows.find(y=>y.correction_id===x[0]);r.status=x[1];r.applied_status=x[2]});render()})}
function openModify(id){const r=S.rows.find(x=>x.correction_id===id);S.dialogIds=[id];$('#dialogOriginal').textContent=r.original_text;$('#modifiedText').value=r.modified_text||r.proposed_text;$('#modifyNotes').value='';$('#modifyDialog').showModal()}
function saveModify(e){e.preventDefault();const text=$('#modifiedText').value.trim(),id=S.dialogIds[0];if(!text)return;const r=S.rows.find(x=>x.correction_id===id),old=[r.status,r.modified_text,r.applied_status];local([id],'MODIFIED',text);closeDialog('modifyDialog');enqueue('decideCorrection',{correctionId:id,status:'MODIFIED',modifiedText:text,notes:$('#modifyNotes').value,sessionId:S.sessionId},()=>{r.status=old[0];r.modified_text=old[1];r.applied_status=old[2];render()})}
function openDiscuss(ids){S.dialogIds=ids;$('#discussNote').value='';$('#discussDialog').showModal();setTimeout(()=>$('#discussNote').focus(),0)}
function saveDiscuss(e){e.preventDefault();const n=$('#discussNote').value.trim();if(!n){showError('Enter a discussion note or press Cancel.');return}const ids=S.dialogIds.slice();closeDialog('discussDialog');decide(ids,'DISCUSS',n)}
function openApply(){const a=S.application||{},ready=Object.values(groups()).filter(g=>gstate(g)==='READY'&&scopeGroup(g)),n=ready.length,c=ready.reduce((sum,g)=>sum+g.filter(r=>['ACCEPTED','MODIFIED'].includes(up(r.status))&&up(r.applied_status)!=='APPLIED').length,0),units=[...new Set(ready.map(g=>g[0].unit_number))].join(', ');S.applyKey=`${a.documentId}|${ready.flatMap(g=>g.map(r=>r.correction_id)).sort().join('|')}`;S.applyChunk=0;S.applyChunks=[];for(let i=0;i<ready.length;i+=10)S.applyChunks.push(ready.slice(i,i+10).flatMap(g=>g.filter(r=>['ACCEPTED','MODIFIED'].includes(up(r.status))&&up(r.applied_status)!=='APPLIED').map(r=>r.correction_id)));S.applyTotals={applied:0,conflicts:0};$('#applyHeading').textContent=a.mode==='LIVE'?'Apply to original live document?':'Apply to pilot copy?';$('#applyDescription').textContent=`${c} approved changes across ${n} fully reviewed paragraphs will be committed for Unit${units.includes(',')?'s':''} ${units}. Large applications resume automatically in small serialized chunks.`;$('#liveConfirmation').classList.toggle('hidden',a.mode!=='LIVE');$('#confirmLive').checked=false;$('#confirmApplyButton').textContent=a.mode==='LIVE'?'Apply to live document':'Apply to pilot copy';if(!a.enabled){showError('Application is disabled in Settings.');return}$('#applyDialog').showModal()}
function applyReady(e){e.preventDefault();const a=S.application||{};if(a.mode==='LIVE'&&!$('#confirmLive').checked){showError('Confirm that this will edit the original live document.');return}document.body.classList.add('busy');const req={unit:S.unit,paragraph:S.paragraph,sessionId:S.sessionId,idempotencyKey:S.applyKey,targetMode:a.mode,targetDocumentId:a.documentId,confirmLive:a.mode==='LIVE'&&$('#confirmLive').checked};applyAttempt(req,0)}
function applyAttempt(req,n){const ids=S.applyChunks[S.applyChunk]||[];req.correctionIds=ids;req.idempotencyKey=`${S.applyKey}|chunk|${S.applyChunk}|${ids.join('|')}`;google.script.run.withSuccessHandler(r=>{S.applyTotals.applied+=Number(r.applied||0);S.applyTotals.conflicts+=Number(r.conflicts||0);if(S.applyChunk+1<S.applyChunks.length&&!r.conflicts){S.applyChunk+=1;$('#applyDescription').textContent=`Applied ${S.applyTotals.applied} changes. Continuing with ${S.applyChunks.length-S.applyChunk} serialized chunk${S.applyChunks.length-S.applyChunk===1?'':'s'}…`;applyAttempt(req,0);return}closeDialog('applyDialog');toast(`${S.applyTotals.applied} corrections applied; ${S.applyTotals.conflicts} conflicts`,S.applyTotals.conflicts);load()}).withFailureHandler(e=>{if(lockError(e)&&n<3){setTimeout(()=>applyAttempt(req,n+1),800*(n+1));return}fail(e)}).applyReadyChunk(req)}
function keyboard(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&!document.querySelector('dialog[open]')){e.preventDefault();$('#search').focus();$('#search').select();return}if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key===']'){e.preventDefault();moveActive(1,S.activeId||orderedVisibleIds()[0])}else if(e.key==='ArrowLeft'||e.key==='['){e.preventDefault();moveActive(-1,S.activeId||orderedVisibleIds()[0])}else if(S.activeId&&e.key.toLowerCase()==='a')decide([S.activeId],'ACCEPTED','Keyboard decision');else if(S.activeId&&e.key.toLowerCase()==='r')decide([S.activeId],'REJECTED','Keyboard decision');else if(S.activeId&&e.key.toLowerCase()==='m')openModify(S.activeId);else if(S.activeId&&e.key.toLowerCase()==='d')openDiscuss([S.activeId])}
function validation(v){const b=$('#validation');b.classList.toggle('hidden',!v||v.ok);if(v&&!v.ok)b.innerHTML='<strong>Queue validation blocked application.</strong><br>'+esc((v.errors||[]).slice(0,20).join(' | '))}
function fail(e){document.body.classList.remove('busy');showError(e&&e.message?e.message:String(e))}
function showError(m){$('#errorText').textContent=m;$('#errorPanel').classList.remove('hidden')}
function clearError(){$('#errorPanel').classList.add('hidden');$('#errorText').textContent=''}
function copyError(){navigator.clipboard.writeText($('#errorText').textContent).then(()=>toast('Error copied')).catch(()=>toast('Copy failed',true))}
function toast(m,err){if(err)return showError(m);const t=$('#toast');$('#toastText').textContent=m;$('#toastUndo').classList.add('hidden');t.classList.remove('error','hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3500)}
function undoToast(m,ids){const t=$('#toast'),b=$('#toastUndo');$('#toastText').textContent=m;b.classList.remove('hidden');b.onclick=()=>{clearTimeout(toast.t);t.classList.add('hidden');undo(ids)};t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),6500)}

// v15 reviewer overrides: render the complete filtered stage so native browser
// Find is complete, group exact decisions, and keep discussion resolutions parked.
function render(){
  const oldMark=S.activeId?document.querySelector(`[data-highlight="${CSS.escape(S.activeId)}"]`):null,
    oldCard=oldMark?.closest('.paragraph-card'),oldGroup=oldCard?.dataset.group,
    oldTop=oldCard?.getBoundingClientRect().top,gs=Object.values(groups()),
    sets={REVIEW:new Set(),DISCUSSION:new Set(),WAITING:new Set(),READY:new Set(),APPLIED:new Set()},
    counts={REVIEW:0,DISCUSSION:0,WAITING:0,READY:0,APPLIED:0};
  gs.forEach((g,gi)=>g.forEach(r=>{const s=rowStage(r,g);counts[s]++;sets[s].add(gi)}));
  for(const x of Object.keys(counts))$('#'+x.toLowerCase()+'Count').textContent=`${counts[x]} corrections · ${sets[x].size} paragraphs`;
  document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===S.stage));
  renderLanes();
  const shown=visibleGroups(),more=$('#loadMore');
  $('#queue').innerHTML=shown.length?shown.map(x=>paragraphCard(x.g,x.relevant)).join(''):'<div class="empty">Nothing in this stage matches the filters.</div>';
  if(more)more.classList.add('hidden');
  bindParagraphs();renderBars(gs,shown);
  if(S.focusNextAfterRender){S.focusNextAfterRender=false;requestAnimationFrame(()=>document.querySelector('.paragraph-card')?.scrollIntoView({block:'start',behavior:'smooth'}));return}
  if(Number.isFinite(oldTop)&&oldGroup&&S.activeId)requestAnimationFrame(()=>{const n=document.querySelector(`[data-highlight="${CSS.escape(S.activeId)}"]`)?.closest('.paragraph-card');if(n&&n.dataset.group===oldGroup)scrollBy(0,n.getBoundingClientRect().top-oldTop)})
}
function controls(r,st){
  const id=esc(r.correction_id);
  if(!unresolved(r)){return`<span>Decision: <strong>${label(st)}</strong></span><button class="secondary" data-undo="${id}">Undo</button>`}
  const family=Number(r.rule_family_size||0)>1&&up(r.review_lane)!=='REFERENCE'?`<button class="secondary pattern-action" data-family="${id}" title="Accept only the eligible pending occurrences in this trusted rule family">Accept pattern (${esc(r.rule_family_size)})</button>`:'',
    acceptLabel=Number(r.decision_group_size||0)>1?`Accept all ${esc(r.decision_group_size)}`:'Accept';
  return`<button class="select-one secondary ${S.selected.has(r.correction_id)?'on':''}" data-toggle="${id}">${S.selected.has(r.correction_id)?'Selected':'Select'}</button>${family}<button class="danger" data-decision="REJECTED" data-id="${id}">Reject</button><button class="secondary" data-modify="${id}">Modify</button><button class="discuss" data-discuss="${id}">Discuss</button><button class="primary" data-decision="ACCEPTED" data-id="${id}">${acceptLabel}</button>`
}
function keyboard(e){
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.querySelector('dialog[open]'))return;
  if(e.key==='ArrowRight'||e.key===']'){e.preventDefault();moveActive(1,S.activeId||orderedVisibleIds()[0])}
  else if(e.key==='ArrowLeft'||e.key==='['){e.preventDefault();moveActive(-1,S.activeId||orderedVisibleIds()[0])}
  else if(S.activeId&&e.key.toLowerCase()==='a')decide([S.activeId],'ACCEPTED','Keyboard decision');
  else if(S.activeId&&e.key.toLowerCase()==='r')decide([S.activeId],'REJECTED','Keyboard decision');
  else if(S.activeId&&e.key.toLowerCase()==='m')openModify(S.activeId);
  else if(S.activeId&&e.key.toLowerCase()==='d')openDiscuss([S.activeId])
}
// Generic preparation view. Automated generation remains disabled until an
// adapter implements the documented contract and preserves Pending-by-default.
function renderPreparation(job){
  const box=$('#prepStatus'),metrics=$('#prepMetrics'),start=$('#startPreparation'),
    resume=$('#resumePreparation'),repair=$('#repairPreparation'),publish=$('#publishPreparation'),
    enabled=!!S.preparation?.enabled;
  box.className='prep-status';
  if(!job){
    box.innerHTML=enabled?'<strong>Adapter enabled.</strong><p>No rows are published until validation succeeds.</p>':'<strong>Manual preparation mode.</strong><p>The read-only source estimator is available. Automated proposal generation is intentionally disabled; see docs/AI_PREPARATION.md before adding an adapter.</p>';
    metrics.classList.add('hidden');start.classList.toggle('hidden',!enabled);
    resume.classList.add('hidden');repair.classList.add('hidden');publish.classList.add('hidden');return;
  }
  const status=up(job.status),phase=S.prepPhase?` · ${S.prepPhase.replaceAll('_',' ').toLowerCase()}`:'';
  box.classList.add(status==='READY_TO_PUBLISH'||status==='PUBLISHED'?'ready':status==='NEEDS_REVIEW'?'blocked':'running');
  box.innerHTML=`<strong>${esc(job.status)}${phase}</strong><p>${esc(job.requestedUnits||'')}${job.lastError?`<br>${esc(job.lastError)}`:''}</p>`;
  metrics.classList.remove('hidden');
  metrics.innerHTML=`<div><strong>${job.completedUnits||0}/${job.totalUnits||0}</strong><span>Units complete</span></div><div><strong>${job.candidateCount||0}</strong><span>Candidates</span></div><div><strong>${job.finalCount||0}</strong><span>Validated findings</span></div><div><strong>0</strong><span>Preaccepted</span></div>`;
  start.classList.toggle('hidden',!enabled||!['PUBLISHED','CANCELED'].includes(status));
  resume.classList.toggle('hidden',!enabled||status!=='RUNNING');repair.classList.toggle('hidden',!enabled||status!=='NEEDS_REVIEW');publish.classList.toggle('hidden',!enabled||status!=='READY_TO_PUBLISH');
}
</script>
